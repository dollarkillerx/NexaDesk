[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bytes = "1"
thiserror = "2"

# See third_party/README.md: DTLS without aws-lc, so Linux builds cross-compile.
[patch.crates-io]
dimpl = { path = "third_party/dimpl" }
