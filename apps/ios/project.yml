# XcodeGen spec: `xcodegen` in this folder writes NexaDesk.xcodeproj (not checked in).
name: NexaDesk
options:
  bundleIdPrefix: app.nexadesk
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
targets:
  NexaDesk:
    type: application
    platform: iOS
    sources:
      - path: NexaDesk
    info:
      path: NexaDesk/Info.plist
      properties:
        # Bonjour browsing for hosts on the LAN (LanBrowser); Xcode merges the
        # INFOPLIST_KEY_* settings below into this file.
        NSBonjourServices: [_nexadesk._udp]
    dependencies:
      - package: SwiftProtobuf
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
    preBuildScripts:
      - name: Build the Rust core
        script: '"${PROJECT_DIR}/scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexadesk.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: NexaDesk/Bridge/nexa_client.h
        LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: -lnexa_client
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "NexaDesk connects to computers on your local network."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust core is built for Apple silicon only (simulator and device).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        # The simulator runs a locally signed app with no team; the Keychain needs
        # a signature (an unsigned app has no keychain access group).
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
