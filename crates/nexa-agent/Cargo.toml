[package]
name = "nexa-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nexa-agent"
path = "src/main.rs"

[dependencies]
nexa-wire = { path = "../nexa-wire" }
nexa-net = { path = "../nexa-net" }
nexa-media = { path = "../nexa-media" }
nexa-auth = { path = "../nexa-auth" }
nexa-clip = { path = "../nexa-clip" }
nexa-input = { path = "../nexa-input" }
nexa-session = { path = "../nexa-session" }
quinn = "=0.11.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "io-util"] }
zeroize = "1"
prost = "0.14"
thiserror.workspace = true
bytes.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[dev-dependencies]
tempfile = "3"
