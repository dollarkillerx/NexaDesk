[package]
name = "nexa-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nexa-agent"
path = "src/main.rs"

[dependencies]
nexa-wire = { path = "../nexa-wire" }
nexa-net = { path = "../nexa-net" }
nexa-media = { path = "../nexa-media" }
nexa-auth = { path = "../nexa-auth" }
nexa-user = { path = "../nexa-user" }
nexa-clip = { path = "../nexa-clip" }
nexa-input = { path = "../nexa-input" }
nexa-session = { path = "../nexa-session" }
nexa-web = { path = "../nexa-web" }
nexa-term = { path = "../nexa-term" }
quinn = "=0.11.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "io-util"] }
zeroize = "1"
prost = "0.14"
png = "0.18"
thiserror.workspace = true
bytes.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }
# UI Automation for an AI agent's view of the screen (docs/MCP.md §13, G2).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[dev-dependencies]
tempfile = "3"
