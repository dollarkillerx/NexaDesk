[package]
name = "nexa-web"
description = "Browser access to a NexaDesk host: the page, its signaling and WebRTC (docs/WEB_CLIENT.md)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexa-auth = { path = "../nexa-auth" }
nexa-wire = { path = "../nexa-wire" }
nexa-media = { path = "../nexa-media" }
nexa-session = { path = "../nexa-session" }
# WebRTC, sans-IO. Pure-Rust crypto: no OpenSSL to ship, same code on every platform.
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
