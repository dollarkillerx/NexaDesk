[package]
name = "nexa-auth"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexa-wire = { path = "../nexa-wire" }
nexa-net = { path = "../nexa-net" }
thiserror.workspace = true
# Same pin as nexa-net (§0).
quinn = "=0.11.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
x509-parser = "0.18"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "alloc", "zeroize"] }
# Pairing PAKE. §0 and the task both require external security review before release.
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
subtle = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
bytes.workspace = true
prost = "0.14"
