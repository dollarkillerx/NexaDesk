[package]
name = "nexa-net"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexa-wire = { path = "../nexa-wire" }
bytes.workspace = true
thiserror.workspace = true
quinn = "=0.11.12"
reed-solomon-simd = "3.1"
arc-swap = "1"
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.6"
if-addrs = "0.15"
# Tailscale LocalAPI status (§4.7).
serde_json = "1"
# LAN discovery (§4.11). No async runtime; runs its own thread.
mdns-sd = { version = "0.21", default-features = false }
# Only for the `sim` feature: the in-process NAT simulator schedules deliveries.
tokio = { version = "1", features = ["time", "rt"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# NWPathMonitor (§4.5 network changes).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"

[features]
sim = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "test-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
