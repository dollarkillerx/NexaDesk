[package]
name = "nexa-session"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexa-wire = { path = "../nexa-wire" }
nexa-net = { path = "../nexa-net" }
nexa-media = { path = "../nexa-media" }
nexa-auth = { path = "../nexa-auth" }
nexa-clip = { path = "../nexa-clip" }
bytes.workspace = true
thiserror.workspace = true
prost = "0.14"
quinn = "=0.11.12"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "net", "fs", "io-util"] }
# File transfer (§3.1 stream 4): integrity check.
sha2 = "0.10"
zeroize = "1"
# Rendezvous (§4.3): sealed candidate exchange, signaling over WSS.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core09 = { package = "rand_core", version = "0.9", features = ["os_rng"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(unix)'.dependencies]
# Free space and the quarantine attribute for received files.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
nexa-net = { path = "../nexa-net", features = ["sim"] }
rcgen = "0.14"
tempfile = "3"
