// Messages crossing the libnexa_client C ABI (§10.1). Kept in step by hand with
// crates/nexa-client/src/proto.rs; both directions are plain proto3.
syntax = "proto3";
package nexa.client;

// nexa_init(cfg). data_dir defaults to ~/Library/Application Support/NexaDesk,
// downloads_dir (where files from hosts are saved) to ~/Downloads/NexaDesk.
message ClientConfig {
  string device_name = 1;
  string data_dir = 2;
  string downloads_dir = 3;
}

enum Mode { MODE_OFFICE = 0; MODE_BALANCED = 1; MODE_GAME = 2; }

// nexa_connect(req). `tag` is echoed on every event of this session.
message ConnectRequest {
  string address = 1;                 // "host:port" (IPv4, IPv6, or a resolvable name), or a 9-digit device ID
  string signal_server = 8;           // wss://server[:port]; needed when address is an ID
  uint64 tag = 2;
  Mode mode = 3;
  uint32 fps = 7;                     // 0 = host's choice
  oneof auth {
    string known_host = 4;            // hex public key from Ready.hosts or Connected.host_key
    string code = 5;                  // one-time code shown by the host
    string password = 6;
  }
}

// nexa_session_command(cmd). Coordinates are view pixels, as passed to attach_view.
message SessionCommand {
  oneof cmd {
    PointerMove move = 1;
    PointerButton button = 2;
    PointerWheel wheel = 3;
    SendText text = 4;
    SetMode mode = 5;
    SetClipboardPolicy clipboard = 6;
    SetAudio audio = 20;
    SelectDisplay display = 21;
    SendFiles send_files = 22;
    CancelTransfer cancel_transfer = 23;
    AnswerTransfer answer_transfer = 24;
  }
}
message PointerMove { double x = 1; double y = 2; }
message PointerButton { uint32 button = 1; bool down = 2; }    // 0 left, 1 right, 2+ others
message PointerWheel { sint32 dx = 1; sint32 dy = 2; }         // 1/120 notch; + is right/up
message SendText { string utf8 = 1; }
message SetMode { Mode mode = 1; uint32 fps = 2; }
message SetClipboardPolicy { bool outbound = 1; bool inbound = 2; }
message SetAudio { bool enabled = 1; }                         // mute is false; needs Permissions.audio
message SelectDisplay { uint32 display = 1; }                  // a DisplayInfo.id from Connected
// §3.1 stream 4. Needs Permissions.file; only this side's own files can be sent.
message SendFiles { repeated string paths = 1; }               // absolute paths, at most 100
message CancelTransfer { uint64 id = 1; }                      // a Transfer.id, either direction
message AnswerTransfer { uint64 id = 1; bool accept = 2; }     // to TRANSFER_NEEDS_CONFIRM

message Permissions {
  bool view = 1; bool input = 2; bool clipboard = 3; bool file = 4; bool audio = 5;
}

message KnownHost { string key = 1; string name = 2; uint64 last_seen = 3; }

// Everything sent to nexa_event_cb. tag 0 means not tied to a session.
message Event {
  uint64 tag = 20;
  oneof body {
    Ready ready = 1;
    Connecting connecting = 2;
    Connected connected = 3;
    StreamChanged stream = 4;
    InputCapture input_capture = 5;
    PasteGate paste_gate = 6;
    ClipboardNotice clipboard = 7;
    Stats stats = 8;
    Disconnected disconnected = 9;
    HostKeyPressed host_key = 10;
    Warning warning = 11;
    Reconnecting reconnecting = 40;  // the transport dropped; the session window stays
    TailnetDevices tailnet = 41;     // tag 0: Tailscale peers that answer on the NexaDesk port
    Transfer transfer = 42;          // a file transfer of this session moved on
    LanDevices lan = 43;             // tag 0: hosts heard on the LAN over mDNS (§4.11)
  }
}

// The device identity loaded. Sent after nexa_init and after a new pairing.
message Ready { string this_device_key = 1; repeated KnownHost hosts = 2; string error = 3; }
enum ConnectStage { STAGE_QUIC = 0; STAGE_RESOLVING = 1; STAGE_GATHERING = 2; STAGE_CHECKING = 3; }
message Connecting { ConnectStage stage = 1; }
message DisplayInfo { uint32 id = 1; string name = 2; uint32 w = 3; uint32 h = 4; }
message Connected {
  string host_key = 1;
  string host_name = 2;
  Permissions perms = 3;
  uint32 host_os = 4;          // 0 unknown, 1 windows, 2 macos, 3 linux
  bool paired_now = 5;         // this connection added or replaced the pin
  repeated DisplayInfo displays = 20;
}
message StreamChanged { uint32 codec = 1; Mode mode = 2; uint32 w = 3; uint32 h = 4; uint32 fps = 5; uint32 display = 20; }
enum CaptureState {
  CAPTURE_INACTIVE = 0;
  CAPTURE_ACTIVE = 1;
  CAPTURE_DEGRADED = 2;        // no Accessibility: NSEvent fallback, Cmd+Tab stays local
  CAPTURE_UNAVAILABLE = 3;
}
message InputCapture { CaptureState state = 1; }
message PasteGate { uint32 waited_ms = 1; bool timed_out = 2; }
message ClipboardNotice { string text = 1; }
message Stats {
  uint64 complete = 1; uint64 lost = 2; uint64 fec_recovered = 3; uint64 decoded = 4;
  uint64 decode_errors = 5; uint64 presented = 6; uint64 rtt_us = 7; uint32 gate_pastes = 8;
  uint32 gate_held = 9; uint32 gate_timeouts = 10;
  uint64 rx_bytes = 11;        // UDP bytes received so far; the UI derives a bitrate
  PathKind path = 12;
  string path_detail = 13;     // "203.0.113.5:4000" or "relay 198.51.100.1:3480"
  uint64 path_rtt_us = 14;     // from connectivity probes; 0 when unknown
  uint64 audio_played = 30;    // audio packets played
  uint64 audio_concealed = 31; // 10 ms frames made up for lost or late packets
  uint32 audio_buffer_us = 32; // mean wait in the jitter buffer
  repeated LatencySegment latency = 40;  // §6.1 segments over the last frames presented
}
enum Segment {
  SEGMENT_HOST_AND_NETWORK = 0;  // capture at the host → last shard here (clock offset, §3.3)
  SEGMENT_RECEIVE = 1;           // first shard → last
  SEGMENT_DECODE_QUEUE = 2;
  SEGMENT_DECODE = 3;
  SEGMENT_PRESENT_QUEUE = 4;
  SEGMENT_PRESENT = 5;
  SEGMENT_TOTAL = 6;             // capture → presented
}
message LatencySegment { Segment segment = 1; uint32 p50_us = 2; uint32 p99_us = 3; }
enum PathKind {
  PATH_UNKNOWN = 0; PATH_DIRECT = 1; PATH_PUNCHED = 2; PATH_RELAY = 3; PATH_TAILSCALE = 4;
  PATH_RELAY_WSS = 5;          // the relay over WebSocket/TCP (UDP blocked)
  PATH_TAILSCALE_DERP = 6;     // Tailscale, relayed through DERP
}
enum DisconnectReason {
  DISCONNECT_UNSPECIFIED = 0;
  DISCONNECT_CLOSED_LOCALLY = 1;
  DISCONNECT_HOST_ENDED = 2;
  DISCONNECT_REPLACED = 3;
  DISCONNECT_PIPELINE_FAILED = 4;
  DISCONNECT_NETWORK = 5;
  DISCONNECT_PIN_MISMATCH = 6;
  DISCONNECT_NOT_PAIRED = 7;
  DISCONNECT_AUTH_FAILED = 8;
  DISCONNECT_RATE_LIMITED = 9;
  DISCONNECT_CONSENT_DENIED = 10;
  DISCONNECT_NO_COMMON_CODEC = 11;
  DISCONNECT_VERSION_MISMATCH = 12;
  DISCONNECT_TIMED_OUT = 13;
  DISCONNECT_INVALID_REQUEST = 14;
  DISCONNECT_INTERNAL = 15;
  DISCONNECT_OFFLINE = 16;         // the device ID is not online
  DISCONNECT_NO_PATH = 17;         // no network path worked, relay included
  DISCONNECT_SIGNAL_SERVER = 18;   // the signaling server is unreachable or refused
}
message Disconnected { DisconnectReason reason = 1; string message = 2; }
message HostKeyPressed {}
message Warning { string text = 1; }
// §4.4 Reconnecting: attempt n started; the 30 s window has remaining_ms left.
// A Connected event for the same tag ends it; Disconnected means it gave up.
message Reconnecting { uint32 attempt = 1; string reason = 2; uint32 remaining_ms = 3; }
message TailnetDevice {
  string name = 1;
  string address = 2;          // "100.x.y.z:47800": connect to it as ip:port
  bool direct = 3;             // false: through DERP
  string os = 4;
  string dns_name = 5;
}
message TailnetDevices { repeated TailnetDevice devices = 1; }
// Unverified hints: TLS and pairing still decide who answers at the address.
message LanDevice {
  string name = 1;
  string address = 2;          // "192.168.1.20:47800": connect to it as ip:port
  string os = 3;
  string device_id = 4;        // as announced; proves nothing
}
message LanDevices { repeated LanDevice devices = 1; }

enum TransferState {
  TRANSFER_WAITING = 0; TRANSFER_NEEDS_CONFIRM = 1; TRANSFER_RUNNING = 2;
  TRANSFER_DONE = 3; TRANSFER_FAILED = 4; TRANSFER_CANCELLED = 5;
}
enum FailReason {
  FAIL_NONE = 0; FAIL_DECLINED = 1; FAIL_TOO_LARGE = 2; FAIL_NOT_PERMITTED = 3; FAIL_INVALID = 4;
  FAIL_HASH_MISMATCH = 5; FAIL_NO_SPACE = 6; FAIL_IO = 7; FAIL_CONNECTION_LOST = 8; FAIL_TIMEOUT = 9;
  FAIL_NOT_A_FILE = 10; FAIL_BUSY = 11;
}
// Ids are unique in the process.
message Transfer {
  uint64 id = 1;
  bool outgoing = 2;             // from this Mac to the host
  string name = 3; uint64 size = 4; uint64 done = 5;
  TransferState state = 6; FailReason reason = 7;
  string path = 8;               // where a received file was saved
  bool by_peer = 9;
}
