[package]
name = "nexa-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
nexa-wire = { path = "../nexa-wire" }
nexa-net = { path = "../nexa-net" }
nexa-media = { path = "../nexa-media" }
nexa-auth = { path = "../nexa-auth" }
nexa-clip = { path = "../nexa-clip" }
nexa-input = { path = "../nexa-input" }
nexa-session = { path = "../nexa-session" }
bytes.workspace = true
# The MCP server for AI agents (src/mcp, docs/MCP.md §16).
base64 = "0.22"
serde_json = "1"
prost = "0.14"
quinn = "=0.11.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[build-dependencies]
csbindgen = "1.9"

[dev-dependencies]
nexa-agent = { path = "../nexa-agent" }
nexa-signal = { path = "../nexa-signal" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# The host's cursor over the view (src/real_windows_cursor.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
