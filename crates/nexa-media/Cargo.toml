[package]
name = "nexa-media"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nexa-wire = { path = "../nexa-wire" }
thiserror.workspace = true
# caps.json (§3.5).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# VideoToolbox, CoreVideo and Metal: the decoder and presenter on macOS and iOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-video-toolbox = "0.3"
libc = "0.2"

# Screen capture and the host side: macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
nexa-opus = { path = "../nexa-opus" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
