[package]
name = "nexa-web-pake"
description = "The browser's half of NexaDesk pairing, compiled to WebAssembly (docs/WEB_CLIENT.md §8)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No OS randomness: the page passes 32 bytes from crypto.getRandomValues (see lib.rs).
spake2 = { version = "0.4", default-features = false }
hkdf = "0.12"
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize = "1"

[dev-dependencies]
nexa-auth = { path = "../nexa-auth" }
nexa-wire = { path = "../nexa-wire" }
