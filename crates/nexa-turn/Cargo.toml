[package]
name = "nexa-turn"
description = "TURN (RFC 8656) for browsers: a server that relays only between its own allocations, and a client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hmac = "0.13"
sha1 = "0.11"
md-5 = "0.11"
crc = "3"
data-encoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror.workspace = true
